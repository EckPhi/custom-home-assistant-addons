name: Update Termix Version

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  check-update:
    runs-on: ubuntu-latest
    name: Check for Termix updates
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Get current image digest
        id: current
        run: |
          # Extract current image from build.yaml
          CURRENT_IMAGE=$(grep "amd64:" termix/build.yaml | awk '{print $2}' | tr -d '"')
          echo "image=$CURRENT_IMAGE" >> $GITHUB_OUTPUT
          echo "Current image: $CURRENT_IMAGE"

      - name: Get latest upstream digest
        id: upstream
        run: |
          IMAGE="ghcr.io/lukegus/termix:latest"
          
          # Use docker buildx imagetools inspect to get digest efficiently (no image download)
          DIGEST=$(docker buildx imagetools inspect "$IMAGE" 2>&1 | grep "Digest:" | head -1 | awk '{print $2}')
          
          if [ -z "$DIGEST" ]; then
            echo "Buildx imagetools failed, trying docker manifest inspect"
            # For multi-platform images, get the manifest list digest
            DIGEST=$(docker manifest inspect "$IMAGE" 2>/dev/null | jq -r 'if .manifests then .manifests[0].digest else .config.digest end' || echo "")
          fi
          
          if [ -z "$DIGEST" ]; then
            echo "Alternative methods failed, falling back to docker pull"
            DIGEST=$(docker pull "$IMAGE" 2>&1 | grep "Digest:" | awk '{print $2}')
          fi
          
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Latest digest: $DIGEST"

      - name: Check if update needed
        id: check
        run: |
          # Store the digest in a file for comparison
          DIGEST_FILE="termix/.image-digest"
          
          if [ -f "$DIGEST_FILE" ]; then
            STORED_DIGEST=$(cat "$DIGEST_FILE")
            echo "Stored digest: $STORED_DIGEST"
          else
            STORED_DIGEST=""
            echo "No stored digest found"
          fi
          
          LATEST_DIGEST="${{ steps.upstream.outputs.digest }}"
          
          if [ -n "$LATEST_DIGEST" ] && [ "$STORED_DIGEST" != "$LATEST_DIGEST" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "New version detected!"
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "No update needed"
          fi

      - name: Update version
        if: steps.check.outputs.update_needed == 'true'
        run: |
          # Get current version from config.yaml
          CURRENT_VERSION=$(grep "^version:" termix/config.yaml | awk '{print $2}' | tr -d '"')
          echo "Current version: $CURRENT_VERSION"
          
          # Increment patch version
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          
          echo "New version: $NEW_VERSION"
          
          # Update config.yaml version
          sed -i "s/version: \"$CURRENT_VERSION\"/version: \"$NEW_VERSION\"/" termix/config.yaml
          
          # Store the new digest
          echo "${{ steps.upstream.outputs.digest }}" > termix/.image-digest
          
          # Update CHANGELOG.md
          DATE=$(date +%Y-%m-%d)
          {
            echo "# Changelog"
            echo ""
            echo "## $NEW_VERSION ($DATE)"
            echo ""
            echo "- Updated to latest upstream Termix Docker image"
            echo "- Image digest: ${{ steps.upstream.outputs.digest }}"
            echo ""
            tail -n +3 termix/CHANGELOG.md
          } > termix/CHANGELOG.md.new
          mv termix/CHANGELOG.md.new termix/CHANGELOG.md
          
          echo "version=$NEW_VERSION" >> $GITHUB_ENV

      - name: Create Pull Request
        if: steps.check.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v7.0.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update Termix to latest upstream version"
          title: "Update Termix to version ${{ env.version }}"
          body: |
            ## Automated Termix Update
            
            This PR updates the Termix add-on to use the latest upstream Docker image.
            
            ### Changes
            - Updated version to ${{ env.version }}
            - New image digest: ${{ steps.upstream.outputs.digest }}
            - Updated CHANGELOG.md
            
            This update was automatically generated by the update-termix workflow.
          branch: update-termix-${{ env.version }}
          delete-branch: true
          labels: |
            dependencies
            automated
