# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Termix Server
version: "1.0.0"
slug: termix
description: Termix server with persistent data storage
url: "https://github.com/EckPhi/custom-home-assistant-addons/tree/main/termix"
arch:
  - aarch64
  - amd64
  - armv7
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Web interface
environment:
  PORT: "8080"
tmpfs: false
